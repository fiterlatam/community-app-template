<div class="col-md-12" ng-controller="LoanForeclosureProjectionController">
    <ul class="breadcrumb">
        <li><a href="#/viewloanaccount/{{accountId}}">{{'label.anchor.viewloanaccount' | translate}}</a></li>
        <li class="active">Foreclosure</li>
    </ul>
    <form class="form-horizontal well" novalidate="" name="foreclosureform" rc-submit="submit()">
        <api-validate></api-validate>
        <fieldset>
            <legend>{{'label.heading.loan.foreclosure' | translate}}</legend>
            <div class="form-group">
                <label class="control-label col-sm-2">{{'label.input.transactiondate' | translate}}<span
                        class="required">*</span></label>
                <div class="col-sm-3">
                    <input id="transactionDate" name="transactionDate" class="form-control" type="text" sort
                           datepicker-pop="dd MMMM yyyy"
                           ng-model="formData.transactionDate" is-open="opened"/>
                </div>
            </div>
            <div class="form-group" ng-if="foreclosuredata">
                <label class="control-label col-sm-2">Principle<span class="required"></span></label>
                <div class="col-sm-3">
                    <input type="text" id="outstandingPrincipalPortion" name="outstandingPrincipalPortion"
                           ng-model="formData.outstandingPrincipalPortion" class="form-control" number-format readonly/>
                </div>
                <div class="col-sm-3">
                </div>
            </div>
            <div class="form-group" ng-if="foreclosuredata">
                <label class="control-label col-sm-2">Interest<span class="required"></span></label>
                <div class="col-sm-3">
                    <input type="text" id="outstandingInterestPortion" name="outstandingInterestPortion"
                           ng-model="formData.outstandingInterestPortion" class="form-control" number-format readonly/>
                </div>
                <div class="col-sm-3">
                </div>
            </div>
            <div class="form-group" ng-if="formData.unrecognizedIncomePortion">
                <label class="control-label col-sm-2">{{'label.totalinterestincome'|translate}}<span class="required"></span></label>
                <div class="col-sm-3">
                    <input type="text" id="unrecognizedIncomePortion" name="unrecognizedIncomePortion"
                           ng-model="formData.unrecognizedIncomePortion" class="form-control" number-format readonly/>
                </div>
                <div class="col-sm-3">
                </div>
            </div>
            <div class="form-group" ng-if="foreclosuredata">
                <label class="control-label col-sm-2">Fee Amount<span class="required"></span></label>
                <div class="col-sm-3">
                    <input type="text" id="outstandingFeeChargesPortion" name="outstandingFeeChargesPortion"
                           ng-model="formData.outstandingFeeChargesPortion" class="form-control" number-format
                           readonly/>
                </div>
                <div class="col-sm-3">
                </div>
            </div>
            <div class="form-group" ng-if="foreclosuredata">
                <label class="control-label col-sm-2">Penalty amount<span class="required"></span></label>
                <div class="col-sm-3">
                    <input type="text" id="outstandingPenaltyChargesPortion" name="outstandingPenaltyChargesPortion"
                           ng-model="formData.outstandingPenaltyChargesPortion" class="form-control" number-format
                           readonly/>
                </div>
                <div class="col-sm-3">
                </div>
            </div>
            <div class="form-group" ng-if="foreclosuredata">
                <label class="control-label col-sm-2">Transaction Amount<span class="required"></span></label>
                <div class="col-sm-3">
                    <input type="text" id="transactionAmount" name="transactionAmount"
                           ng-model="formData.transactionAmount" class="form-control" number-format readonly/>
                </div>
                <div class="col-sm-3">
                </div>
            </div>

            <br/>
            <div class="col-md-offset-3">
                <button id="cancel" type="reset" class="btn btn-default" ng-click="cancel()">{{ 'label.button.close' |
                    translate }}
                </button>
            </div>
        </fieldset>
    </form>
</div>
