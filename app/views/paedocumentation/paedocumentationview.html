<div class="content-container" ng-controller="PaeDocumentationViewController">
    <div class="card">
        <div class="content">
            <div class="toolbar">
                <h4 class="pull-left">{{'label.anchor.paedocumentationview' | translate}}</h4>
            </div>
            <div>
                <p>{{'label.view.paedocumentationview' | translate}}</p>
                <table class="table table-bordered table-striped" ng-if="requiredDocuments.length">
                    <thead>
                        <tr>
                            <th>{{'label.input.name' | translate}}</th>
                            <th>{{'label.input.acceptedtype' | translate}}</th>
                            <th>{{'label.input.required' | translate}}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr ng-repeat="doc in requiredDocuments">
                            <td><input type="text" ng-model="doc.name" class="form-control" /></td>
                            <td>
                                <select ng-model="doc.acceptedType" class="form-control">
                                    <option value="PDF">PDF</option>
                                    <option value="DOCX">DOCX</option>
                                    <option value="JPG">JPG</option>
                                </select>
                            </td>
                            <td class="text-center">
                                <input type="checkbox" ng-model="doc.required" />
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div ng-if="!requiredDocuments.length">
                    <em>{{'label.no.required.documents' | translate}}</em>
                </div>
            </div>
            <!-- Add Document Form -->
            <hr/>
            <h3>Add Required Documents</h3>
            <div class="alert alert-info form-horizontal">
            <form class="form-horizontal" ng-submit="addRequiredDocument()">
                <div class="form-group">
                    <label class="col-sm-2">{{'label.input.name' | translate}}</label>
                    <div class="col-sm-4">
                        <input type="text" ng-model="newDocument.name" class="form-control" required />
                    </div>
                    <label class="col-sm-2 control-label">{{'label.input.acceptedtype' | translate}}</label>
                    <div class="col-sm-2">
                        <select ng-model="newDocument.acceptedType" class="form-control" required>
                            <option value="PDF">PDF</option>
                            <option value="DOCX">DOCX</option>
                            <option value="JPG">JPG</option>
                        </select>
                    </div>
                    <div class="col-sm-2">
                        <label class="checkbox-inline">
                            <input type="checkbox" ng-model="newDocument.required" /> {{'label.requirefield' | translate}}
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="col-sm-offset-10 col-sm-2">
                        <button type="submit" class="btn btn-primary">{{'label.button.add' | translate}}</button>
                    </div>
                </div>
            </form>
            </div>
        </div>
    </div>
</div>
